<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>OG Template</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 400px; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Nanum Gothic", system-ui, sans-serif;
    color: #2D2D2D;
    -webkit-font-smoothing: antialiased;
  }
  .emoji {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", system-ui, sans-serif;
  }
  .card {
    width: 800px; height: 400px;
    position: relative;
    background: var(--bg);
    display: flex; align-items: center;
    padding: 0 50px;
  }

  /* per-type layout — 가로 분할, 동물은 왼쪽 / 텍스트는 오른쪽 */
  .left {
    width: 240px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .circle {
    width: 220px; height: 220px; border-radius: 50%;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 6px rgba(255,255,255,0.6);
  }
  .circle .e {
    font-size: 130px; line-height: 1;
    transform: translateY(2px);
  }
  .right {
    flex: 1; padding-left: 32px;
  }
  .label {
    font-size: 16px; color: #88888899; font-weight: 700;
    letter-spacing: 0.4px; margin-bottom: 12px;
  }
  .badge {
    display: inline-block; padding: 6px 18px; border-radius: 24px;
    background: #ffffffee; color: var(--accent);
    font-size: 22px; font-weight: 800; letter-spacing: 3px;
    margin-bottom: 12px;
  }
  .name {
    font-size: 56px; color: var(--accent); font-weight: 800;
    line-height: 1.0; margin-bottom: 10px;
  }
  .tag {
    font-size: 22px; color: #555; font-weight: 700;
  }
  .footer {
    position: absolute; bottom: 18px; right: 24px;
    font-size: 14px; color: #aaa; font-weight: 600;
  }

  /* default mode (no type) — 가로 풀폭, 중앙 정렬 */
  body.default .card {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 36px 50px;
    background: linear-gradient(135deg, #FFE5EC 0%, #FFEDD5 50%, #E9ECFF 100%);
    text-align: center;
  }
  body.default .title {
    font-size: 50px; font-weight: 800; color: #2D2D2D;
    margin-bottom: 8px; letter-spacing: -1px;
  }
  body.default .subtitle {
    font-size: 20px; color: #666; font-weight: 700;
    margin-bottom: 22px;
  }
  body.default .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    column-gap: 6px; row-gap: 8px;
    font-size: 44px; line-height: 1;
    width: 640px; max-width: 100%;
    margin: 0 auto;
  }
  body.default .grid span { display: inline-block; line-height: 1; }
  body.default .desc {
    font-size: 16px; color: #777; font-weight: 600;
    margin-top: 22px; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
const CHARS = {
  ENFJ: { emoji: "🦁", name: "사자", tag: "친구들의 리더", color: "#FF8C42", bg: "#FFF3E8" },
  ENFP: { emoji: "🦜", name: "앵무새", tag: "에너지 넘치는 수다쟁이", color: "#FF6B9D", bg: "#FFF0F6" },
  ENTJ: { emoji: "🦅", name: "독수리", tag: "당당한 대장", color: "#4361EE", bg: "#EEF1FF" },
  ENTP: { emoji: "🦊", name: "여우", tag: "엉뚱한 발명가", color: "#F72585", bg: "#FEE8F4" },
  ESFJ: { emoji: "🐶", name: "강아지", tag: "모두를 챙기는 친구", color: "#E9A800", bg: "#FFFBE8" },
  ESFP: { emoji: "🐬", name: "돌고래", tag: "신나는 파티메이커", color: "#0EA5C9", bg: "#E8F9FF" },
  ESTJ: { emoji: "🦫", name: "비버", tag: "꼼꼼한 반장", color: "#7B2D8B", bg: "#F3E8F8" },
  ESTP: { emoji: "🐆", name: "치타", tag: "겁없는 모험가", color: "#E63946", bg: "#FEE8E8" },
  INFJ: { emoji: "🦉", name: "부엉이", tag: "조용한 관찰자", color: "#457B9D", bg: "#EBF1F5" },
  INFP: { emoji: "🐱", name: "고양이", tag: "감성적인 몽상가", color: "#B5838D", bg: "#F8EDEF" },
  INTJ: { emoji: "🐙", name: "문어", tag: "혼자서도 잘해요", color: "#3A0CA3", bg: "#ECEAFF" },
  INTP: { emoji: "🦝", name: "너구리", tag: "생각이 너무 많아", color: "#2A9D8F", bg: "#E8F5F5" },
  ISFJ: { emoji: "🐰", name: "토끼", tag: "따뜻한 수호자", color: "#4D8B31", bg: "#F0F8E8" },
  ISFP: { emoji: "🐼", name: "판다", tag: "평화로운 예술가", color: "#43AA8B", bg: "#E8F7F3" },
  ISTJ: { emoji: "🐢", name: "거북이", tag: "믿음직한 계획왕", color: "#277DA1", bg: "#E8F4F8" },
  ISTP: { emoji: "🦔", name: "고슴도치", tag: "조용한 해결사", color: "#6D6875", bg: "#F0EEF2" },
};

const params = new URLSearchParams(window.location.search);
const type = params.get("type");
const card = document.getElementById("card");

if (!type || !CHARS[type]) {
  document.body.classList.add("default");
  card.innerHTML = `
    <div class="title">🌟 어린이 MBTI</div>
    <div class="subtitle">우리 아이는 어떤 동물일까?</div>
    <div class="grid emoji">
      <span>🦁</span><span>🦜</span><span>🦅</span><span>🦊</span><span>🐶</span><span>🐬</span><span>🦫</span><span>🐆</span>
      <span>🦉</span><span>🐱</span><span>🐙</span><span>🦝</span><span>🐰</span><span>🐼</span><span>🐢</span><span>🦔</span>
    </div>
    <div class="desc">5~13세 아이의 성격을 16가지 동물 캐릭터로 알려드려요</div>
  `;
} else {
  const c = CHARS[type];
  document.documentElement.style.setProperty("--accent", c.color);
  document.documentElement.style.setProperty("--bg", `linear-gradient(135deg, ${c.bg} 0%, #ffffff 100%)`);
  document.documentElement.style.setProperty("--shadow", c.color + "30");
  card.innerHTML = `
    <div class="left"><div class="circle"><span class="e emoji">${c.emoji}</span></div></div>
    <div class="right">
      <div class="label">어린이 MBTI · 우리 아이는 어떤 동물?</div>
      <div class="badge">${type}</div>
      <div class="name">${c.name}형</div>
      <div class="tag">${c.tag}</div>
    </div>
    <div class="footer">어린이 MBTI</div>
  `;
}
</script>
</body>
</html>
